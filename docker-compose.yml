version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: pharma_sales_postgres

    environment:
      POSTGRES_DB: pharma_sales
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: always

volumes:
  postgres_data: